[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starlette-admin-adminlte"
description = "AdminLTE 4 theme for starlette-admin"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jocelin Hounon", email = "hounonj@gmail.com" }]
version = "0.1.0"
keywords = ["starlette-admin", "admin", "adminlte", "bootstrap", "starlette"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "starlette-admin>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/jowilf/starlette-admin-adminlte"
Repository = "https://github.com/jowilf/starlette-admin-adminlte"

[project.entry-points."starlette_admin.themes"]
adminlte = "starlette_admin_adminlte:AdminlteTheme"

[project.optional-dependencies]
i18n = ["babel>=2.17.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/starlette_admin_adminlte"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    "nh3>=0.3.6",
    "email-validator>=2.3.0",
    "pillow>=12.3.0",
    "babel>=2.18.0",
    "ruff>=0.8",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"